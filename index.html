<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7F77DD">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅制覇">
  <meta name="description" content="カップルで日本の絶景スポットを制覇しよう">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>旅制覇 Journey</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --color-bg:#ffffff;
      --color-bg2:#f5f5f7;
      --color-bg3:#ebebed;
      --color-border:#e0e0e0;
      --color-border2:#d0d0d0;
      --color-text:#1a1a1a;
      --color-text2:#555;
      --color-text3:#999;
      --color-primary:#7F77DD;
      --color-primary-light:rgba(127,119,221,0.1);
      --color-wish:#F59E0B;
      --color-visited:#7F77DD;
      --radius:14px;
      --radius-sm:8px;
      --font:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --color-bg:#1c1c1e;
        --color-bg2:#2c2c2e;
        --color-bg3:#3a3a3c;
        --color-border:#3a3a3c;
        --color-border2:#48484a;
        --color-text:#f2f2f7;
        --color-text2:#aeaeb2;
        --color-text3:#636366;
        --color-primary-light:rgba(127,119,221,0.15);
      }
    }
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font);background:var(--color-bg);color:var(--color-text);display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
    /* セーフエリア対応 */
    .header{padding:max(16px,env(safe-area-inset-top)) 16px 12px;border-bottom:0.5px solid var(--color-border);background:var(--color-bg);position:sticky;top:0;z-index:100}
    .title-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .back-btn{background:var(--color-bg2);border:0.5px solid var(--color-border2);color:var(--color-text);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px;font-family:var(--font)}
    .app-label{font-size:10px;letter-spacing:2px;color:var(--color-text3);text-transform:uppercase;margin-bottom:2px}
    .app-title{font-size:18px;font-weight:600;color:var(--color-text)}
    .progress-row{display:flex;align-items:center;gap:10px}
    .progress-bar{flex:1;height:5px;background:var(--color-bg3);border-radius:3px;overflow:hidden}
    .progress-fill{height:100%;background:var(--color-primary);border-radius:3px;transition:width 0.5s ease}
    .progress-label{font-size:11px;color:var(--color-text3);white-space:nowrap}
    .tabs{display:flex;background:var(--color-bg);border-bottom:0.5px solid var(--color-border)}
    .tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;background:none;border:none;color:var(--color-text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);white-space:nowrap}
    .tab.active{color:var(--color-primary);border-bottom:2px solid var(--color-primary);font-weight:600}
    .main{flex:1;overflow-y:auto;padding:12px 16px max(24px,env(safe-area-inset-bottom))}
    /* グリッド */
    .hint{font-size:13px;color:var(--color-text3);text-align:center;margin-bottom:14px}
    .pref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
    .pref-btn{background:var(--color-bg);border:0.5px solid var(--color-border);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;transition:border-color 0.15s,transform 0.1s;width:100%}
    .pref-btn:active{transform:scale(0.97)}
    .pref-btn.done{border:1.5px solid var(--color-primary)}
    .pref-thumb{width:100%;height:90px;display:flex;align-items:center;justify-content:center;background:var(--color-bg2)}
    .pref-body{padding:8px 10px}
    .pref-name{font-size:13px;font-weight:600;color:var(--color-text);margin-bottom:3px}
    .pref-count{font-size:11px;color:var(--color-text3);margin-bottom:6px}
    .mini-bar{height:3px;background:var(--color-bg3);border-radius:2px}
    .mini-fill{height:100%;background:var(--color-primary);border-radius:2px}
    /* スポットリスト */
    .spot-list{display:flex;flex-direction:column;gap:10px}
    .spot-card{background:var(--color-bg);border:0.5px solid var(--color-border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color 0.15s,transform 0.1s}
    .spot-card:active{transform:scale(0.98)}
    .spot-card.visited{border:1.5px solid var(--color-primary)}
    .spot-card.wishlist{border:1.5px solid var(--color-wish)}
    .spot-header{display:flex}
    .spot-map-area{width:130px;min-width:130px;background:var(--color-bg2);display:flex;align-items:center;justify-content:center;padding:8px}
    .spot-body{padding:12px 14px;flex:1;min-width:0}
    .spot-name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
    .spot-name{font-size:15px;font-weight:600;color:var(--color-text)}
    .badge{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap}
    .badge-visited{background:var(--color-primary);color:#fff}
    .badge-wish{background:var(--color-wish);color:#fff}
    .spot-desc{font-size:12px;color:var(--color-text2);line-height:1.6;margin-bottom:8px}
    .season-tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:10px;font-weight:600}
    /* 詳細画面 */
    .hero-section{border-radius:var(--radius);overflow:hidden;margin-bottom:14px;background:var(--color-bg2);display:flex;border:0.5px solid var(--color-border)}
    .hero-emoji{flex:1;display:flex;align-items:center;justify-content:center;font-size:64px;padding:20px}
    .hero-map{width:155px;min-width:155px;display:flex;align-items:center;justify-content:center;padding:12px;border-left:0.5px solid var(--color-border)}
    .action-links{display:flex;gap:8px;margin-bottom:12px}
    .action-link{display:flex;align-items:center;gap:8px;flex:1;background:var(--color-bg2);border:0.5px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--color-text);font-size:13px;cursor:pointer;text-decoration:none;transition:border-color 0.15s;font-family:var(--font)}
    .action-link:active{opacity:0.7}
    .insta-link{border-color:rgba(225,48,108,0.3)}
    .detail-card{background:var(--color-bg);border:0.5px solid var(--color-border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .detail-name{font-size:20px;font-weight:700;color:var(--color-text);margin-bottom:8px}
    .detail-desc{font-size:14px;color:var(--color-text2);line-height:1.7;margin-bottom:10px}
    /* もっと見る */
    .more-section{margin-top:14px;border-top:0.5px solid var(--color-border);padding-top:12px}
    .more-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--color-primary);font-size:13px;cursor:pointer;padding:0;font-family:var(--font)}
    .more-arrow{transition:transform 0.25s ease;font-size:12px;display:inline-block}
    .more-toggle.open .more-arrow{transform:rotate(180deg)}
    .more-content{overflow:hidden;max-height:0;transition:max-height 0.35s ease,opacity 0.3s ease;opacity:0}
    .more-content.open{max-height:800px;opacity:1}
    .more-inner{padding-top:12px;display:flex;flex-direction:column;gap:10px}
    .more-block{background:var(--color-bg2);border-radius:var(--radius-sm);padding:12px}
    .more-block-label{font-size:11px;color:var(--color-text3);margin-bottom:6px;font-weight:600}
    .more-block-text{font-size:13px;color:var(--color-text);line-height:1.7}
    .tips-list{display:flex;flex-direction:column;gap:6px}
    .tip-item{font-size:13px;color:var(--color-text);line-height:1.6}
    .tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .keyword-tag{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--color-bg);border:0.5px solid var(--color-border);color:var(--color-text2)}
    /* ボタン */
    .action-btns{display:flex;gap:8px;margin-bottom:12px}
    .wish-btn{flex:1;padding:14px;background:var(--color-bg2);border:1.5px solid var(--color-wish);border-radius:var(--radius);color:var(--color-wish);font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:var(--font)}
    .wish-btn.active{background:var(--color-wish);color:#fff}
    .wish-btn:disabled{opacity:0.4;cursor:default}
    .seika-btn{flex:1;padding:14px;background:var(--color-primary);border:none;border-radius:var(--radius);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:var(--font)}
    .seika-btn:active{opacity:0.85;transform:scale(0.98)}
    .seika-btn.done{background:var(--color-bg2);border:1.5px solid var(--color-primary);color:var(--color-primary)}
    .visit-date{text-align:center;font-size:12px;color:var(--color-text3);margin-bottom:10px}
    /* メモ */
    .memo-card{background:var(--color-bg);border:0.5px solid var(--color-border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
    .memo-label{font-size:12px;color:var(--color-text3);margin-bottom:8px;font-weight:600}
    textarea{width:100%;background:var(--color-bg2);border:0.5px solid var(--color-border);border-radius:var(--radius-sm);color:var(--color-text);padding:10px;font-size:13px;resize:vertical;min-height:80px;font-family:var(--font);line-height:1.5;outline:none}
    textarea:focus{border-color:var(--color-primary)}
    /* 行きたい */
    .category-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .category-card{background:var(--color-bg);border:0.5px solid var(--color-border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;text-align:center;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:10px}
    .category-card:active{transform:scale(0.97)}
    .category-card.selected{border:2px solid var(--color-primary);background:var(--color-primary-light)}
    .category-icon{font-size:40px}
    .category-name{font-size:14px;font-weight:600;color:var(--color-text)}
    .category-count{font-size:11px;color:var(--color-text3)}
    .category-bar{height:4px;width:100%;background:var(--color-bg3);border-radius:2px;overflow:hidden;margin-top:4px}
    .category-bar-fill{height:100%;background:var(--color-primary);border-radius:2px;transition:width 0.4s ease}
    /* 都道府県制覇マップ */
    .pref-conquest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
    .pref-conquest-btn{background:var(--color-bg2);border:0.5px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 6px;cursor:pointer;text-align:center;transition:all 0.15s;font-family:var(--font)}
    .pref-conquest-btn:active{transform:scale(0.95)}
    .pref-conquest-btn.done{background:var(--color-primary);border-color:var(--color-primary)}
    .pref-conquest-btn.done .pref-conquest-name{color:#fff}
    .pref-conquest-btn.done .pref-conquest-date{color:rgba(255,255,255,0.7)}
    .pref-conquest-name{font-size:13px;font-weight:600;color:var(--color-text);display:block;margin-bottom:2px}
    .pref-conquest-date{font-size:9px;color:var(--color-text3);display:block}
    .conquest-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .conquest-stat{background:var(--color-bg2);border:0.5px solid var(--color-border);border-radius:var(--radius);padding:12px;text-align:center}
    .conquest-stat-num{font-size:24px;font-weight:700;color:var(--color-primary)}
    .conquest-stat-label{font-size:11px;color:var(--color-text3);margin-top:2px}
    /* カテゴリ選択画面 */
    .home-header{text-align:center;padding:20px 0 16px}
    .home-title{font-size:22px;font-weight:700;color:var(--color-text);margin-bottom:6px}
    .home-sub{font-size:13px;color:var(--color-text3)}
    .empty-icon{font-size:48px;margin-bottom:16px}
    .empty-text{font-size:15px;color:var(--color-text2);margin-bottom:6px;font-weight:600}
    .empty-sub{font-size:13px}
    .section-label{font-size:12px;color:var(--color-text3);margin-bottom:8px;font-weight:600}
    /* 制覇マップ */
    .map-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
    .stat-card{background:var(--color-bg2);border:0.5px solid var(--color-border);border-radius:var(--radius);padding:12px;text-align:center}
    .stat-num{font-size:26px;font-weight:700;color:var(--color-primary)}
    .stat-label{font-size:11px;color:var(--color-text3);margin-top:2px}
    .japan-map-wrap{background:var(--color-bg2);border-radius:var(--radius);padding:16px;margin-bottom:16px;text-align:center;border:0.5px solid var(--color-border)}
    .map-legend{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text2)}
    .legend-dot{width:10px;height:10px;border-radius:50%}
    .visited-pref-list{display:flex;flex-direction:column;gap:6px}
    .visited-pref-item{background:var(--color-bg2);border:0.5px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
    .visited-pref-item:active{opacity:0.7}
    .visited-pref-item.complete{border-color:var(--color-primary);background:var(--color-primary-light)}
    .vpref-name{font-size:14px;font-weight:600;color:var(--color-text);flex:1}
    .vpref-bar-wrap{width:70px}
    .vpref-bar{height:4px;background:var(--color-bg3);border-radius:2px;overflow:hidden}
    .vpref-bar-fill{height:100%;background:var(--color-primary);border-radius:2px}
    .vpref-count{font-size:11px;color:var(--color-text3);white-space:nowrap}
  </style>
</head>
<body>

<div class="header">
  <div class="title-row">
    <button class="back-btn" id="back-btn" style="display:none">← 戻る</button>
    <div>
      <div class="app-label">旅制覇 Journey</div>
      <div class="app-title" id="app-title">カテゴリを選ぼう</div>
    </div>
  </div>
  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">0/28 (0%)</div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" onclick="switchTab('spots')">🗾 スポット</button>
  <button class="tab" onclick="switchTab('wishlist')">🌟 行きたい</button>
  <button class="tab" onclick="switchTab('mapview')">📍 制覇マップ</button>
</div>

<div class="main" id="main"></div>

<script>
const JAPAN_POS={北海道:{x:370,y:55,r:30},青森:{x:372,y:128,r:13},岩手:{x:378,y:155,r:13},宮城:{x:368,y:175,r:12},秋田:{x:355,y:155,r:13},山形:{x:352,y:178,r:12},福島:{x:355,y:200,r:13},茨城:{x:355,y:228,r:11},栃木:{x:338,y:222,r:11},群馬:{x:320,y:222,r:11},埼玉:{x:325,y:238,r:10},千葉:{x:348,y:248,r:11},東京:{x:330,y:248,r:10},神奈川:{x:325,y:260,r:11},新潟:{x:315,y:200,r:13},富山:{x:292,y:218,r:10},石川:{x:275,y:215,r:10},福井:{x:268,y:238,r:9},山梨:{x:312,y:258,r:10},長野:{x:298,y:242,r:12},静岡:{x:310,y:275,r:12},愛知:{x:285,y:272,r:12},三重:{x:272,y:282,r:11},滋賀:{x:262,y:268,r:10},京都:{x:252,y:262,r:11},大阪:{x:248,y:278,r:11},兵庫:{x:235,y:272,r:12},奈良:{x:258,y:285,r:10},和歌山:{x:248,y:300,r:11},鳥取:{x:225,y:258,r:10},島根:{x:208,y:258,r:11},岡山:{x:228,y:272,r:11},広島:{x:215,y:278,r:12},山口:{x:198,y:285,r:11},徳島:{x:248,y:292,r:10},香川:{x:238,y:285,r:9},愛媛:{x:222,y:292,r:11},高知:{x:232,y:305,r:12},福岡:{x:192,y:310,r:13},佐賀:{x:180,y:318,r:10},長崎:{x:168,y:318,r:11},熊本:{x:192,y:328,r:12},大分:{x:210,y:315,r:11},宮崎:{x:212,y:335,r:11},鹿児島:{x:200,y:352,r:13},沖縄:{x:168,y:420,r:11}};
 const PREF_SVG={};

  const SPOTS={
  北海道:[
    {id:"h1",name:"知床五湖",desc:"世界自然遺産の原生林と湖が生み出す、手つかずの絶景。",detail:{reason:"日本最後の秘境とも呼ばれる知床は、ヒグマや鮭が生息する生態系がそのまま残る場所。5つの湖が点在する遊歩道を歩けば、対岸に知床連山を望む絶景が広がります。",tips:["🐻 ヒグマ出没期は高架木道のみ歩行可能。事前確認を","🌅 早朝の湖面は鏡のように山が映り絶景","🎫 地上遊歩道はレクチャー受講が必要（所要30分）"],keywords:["世界遺産","秘境","ヒグマ","原生林","湖"]},season:"夏・秋",sc:"#fff8e1",st:"#f57f17",e:"🏔️",area:"北海道東部・斜里町",lat:44.071,lng:145.011,px:152,py:62,tag:"Shiretoko Japan"},
    {id:"h2",name:"美瑛の丘",desc:"なだらかな丘に広がるパッチワーク状の畑。北海道らしい雄大な風景。",detail:{reason:"麦、じゃがいも、ビートなど異なる作物が色とりどりに広がる丘は、まるで大きなキャンバス。季節ごとに色が変わり、何度来ても新しい景色に出会えます。",tips:["🚲 レンタサイクルで周回がおすすめ（約2〜3時間）","📸 「パッチワークの路」が写真映えスポット","🌻 7月はひまわり、9月はコスモスが見頃"],keywords:["丘","パッチワーク","サイクリング","農村","北海道らしい"]},season:"夏",sc:"#fff8e1",st:"#f57f17",e:"🌾",area:"北海道中部・美瑛町",lat:43.596,lng:142.467,px:94,py:72,tag:"Biei Hills Hokkaido"},
    {id:"h3",name:"富良野のラベンダー畑",desc:"7月に紫一色に染まる幻想的なラベンダー畑。",detail:{reason:"日本最大級のラベンダー産地・富良野。ファーム富田のラベンダーが見頃を迎える7月は、丘全体が紫色に染まります。",tips:["📅 見頃は7月上旬〜中旬がピーク","🎠 ロープウェイから見る全体像は圧巻","🍦 ラベンダーソフトクリームは定番土産"],keywords:["ラベンダー","7月","紫","香り","ファーム富田"]},season:"夏",sc:"#fff8e1",st:"#f57f17",e:"💜",area:"北海道中部・富良野市",lat:43.35,lng:142.383,px:90,py:82,tag:"Furano lavender"},
    {id:"h4",name:"摩周湖",desc:"世界有数の透明度を誇る神秘の湖。",detail:{reason:"外来種が入り込まない閉鎖性の高い湖で、透明度は世界トップクラス。晴れた日のコバルトブルーの湖面は格別です。",tips:["☁️ 霧の日も神秘的でむしろ人気","🔭 第一展望台からの眺めが定番","❄️ 冬は−30℃に。防寒必須"],keywords:["透明度","神秘","霧","コバルトブルー","カルデラ湖"]},season:"春〜秋",sc:"#f3e5f5",st:"#6a1b9a",e:"🌊",area:"北海道東部・弟子屈町",lat:43.573,lng:144.533,px:138,py:74,tag:"Lake Mashu Hokkaido"},

  青森:[

    {id:"gm2",name:"吹割の滝",desc:"「東洋のナイアガラ」と称される珍しい形の滝。",detail:{reason:"川の中央部が割れたような独特の形をしており、幅30m・高さ7mの滝が豪快に流れます。周辺の遊歩道からさまざまな角度で楽しめます。",tips:["🌊 増水時は遊歩道が閉鎖になる場合あり","🍁 紅葉シーズンが特に美しい","📸 河原に降りての撮影スポットが人気"],keywords:["滝","ナイアガラ","珍しい","紅葉","絶景"]},season:"春〜秋",sc:"#e3f2fd",st:"#1565c0",e:"💧",area:"群馬県北部・沼田市",lat:36.767,lng:139.183,px:40,py:52,tag:"Fukiware falls Japan"},
    {id:"gm3",name:"伊香保温泉",desc:"石段街が有名な歴史ある温泉地。",detail:{reason:"365段の石段を中心に旅館や土産店が並ぶ風情ある温泉地。茶褐色の「黄金の湯」と無色透明の「白銀の湯」の2種類の温泉が楽しめます。",tips:["♨️ 石段を上りながら温泉街を散策","🎎 伊香保グリーン牧場も近くにある","🌸 春は桜、秋は紅葉が美しい"],keywords:["温泉","石段","風情","黄金の湯","カップル"]},season:"通年",sc:"#fff3e0",st:"#e65100",e:"♨️",area:"群馬県中部・渋川市",lat:36.567,lng:138.933,px:44,py:58,tag:"Ikaho onsen Japan"},

  埼玉:[
    {id:"st1",name:"秩父・芝桜の丘",desc:"春に100万株の芝桜が咲き誇る絶景。",detail:{reason:"羊山公園の丘一面に広がる約100万株の芝桜は、ピンク・白・紫のグラデーションが美しく圧巻。秩父の山々を背景にした景色はSNSでも大人気。",tips:["🌸 見頃は4月中旬〜5月上旬","🚃 西武秩父駅から徒歩約20分","🍜 秩父のわらじカツ丼も名物"],keywords:["芝桜","春","絶景","インスタ映え","秩父"]},season:"春",sc:"#fce4ec",st:"#c2185b",e:"🌸",area:"埼玉県西部・秩父市",lat:35.983,lng:139.083,px:40,py:62,tag:"Chichibu shibazakura Japan"},
    {id:"st2",name:"川越（小江戸）",desc:"江戸時代の蔵造りの町並みが残る「小江戸」。",detail:{reason:"江戸時代の蔵造りの建物が立ち並ぶ「蔵造りの町並み」は国の重要伝統的建造物群。菓子屋横丁や時の鐘など、2人で散策が楽しめます。",tips:["🛍️ 菓子屋横丁でレトロなお菓子を食べ歩き","🔔 時の鐘は今も1日4回鐘が鳴る","👘 着物レンタルで散策もおすすめ"],keywords:["小江戸","蔵造り","食べ歩き","歴史","散策"]},season:"通年",sc:"#fff3e0",st:"#e65100",e:"🏘️",area:"埼玉県中部・川越市",lat:35.917,lng:139.483,px:48,py:64,tag:"Kawagoe old town Japan"},

  千葉:[
    {id:"cb1",name:"鋸山",desc:"断崖絶壁と巨大な石仏が印象的な山。",detail:{reason:"日本寺境内にある高さ31mの「百尺観音」や地獄のぞきからの絶景が有名。東京湾を一望できるロープウェイからの景色も絶景です。",tips:["🎢 ロープウェイが便利（登山道もあり）","😱 「地獄のぞき」は足がすくむほどの絶壁","🌊 山頂から東京湾の眺めが最高"],keywords:["断崖","石仏","地獄のぞき","東京湾","ロープウェイ"]},season:"通年",sc:"#e8f5e9",st:"#2e7d32",e:"⛰️",area:"千葉県南部・鋸南町",lat:35.15,lng:139.833,px:56,py:68,tag:"Nokogiriyama Japan"},
    {id:"cb2",name:"九十九里浜",desc:"全長約66kmにわたる日本最長級の砂浜。",detail:{reason:"太平洋に面した広大な砂浜は、サーフィンや潮干狩りで人気。夕暮れ時の海岸線は特にロマンチックで、カップルのドライブコースとして定番。",tips:["🏄 サーフィンのメッカとして有名","🐚 春は潮干狩りが楽しめる","🌅 夕日スポットとして人気"],keywords:["砂浜","サーフィン","夕日","ドライブ","カップル"]},season:"通年",sc:"#e0f7fa",st:"#006064",e:"🏖️",area:"千葉県外房・九十九里町",lat:35.517,lng:140.433,px:64,py:64,tag:"Kujukuri beach Japan"},
    {id:"cb3",name:"館山・大房岬",desc:"南房総の温暖な気候と美しい海岸線。",detail:{reason:"房総半島の先端に位置し、温暖な気候でフラワーラインなどの花畑が有名。大房岬からは東京湾と太平洋を同時に望める絶景が楽しめます。",tips:["🌺 1〜2月に菜の花や水仙が見頃","🐬 イルカウォッチングのクルーズも人気","🍣 新鮮な海の幸が豊富"],keywords:["南房総","花畑","海岸","温暖","絶景"]},season:"通年",sc:"#e8f5e9",st:"#2e7d32",e:"🌺",area:"千葉県南部・館山市",lat:34.983,lng:139.867,px:58,py:72,tag:"Tateyama cape Japan"},

    {id:"t2",name:"お台場の夜景",desc:"レインボーブリッジと東京湾の夜景は都市の絶景。",detail:{reason:"レインボーブリッジ、東京タワー、スカイツリーが一望できる都市夜景の定番スポット。",tips:["🌇 日没30分後が最も美しい","🚢 水上バスでアクセスも非日常感があっておすすめ","🎡 観覧車からの夜景もカップルに人気"],keywords:["夜景","デート","レインボーブリッジ","海","都市"]},season:"通年",sc:"#e8f5e9",st:"#2e7d32",e:"🌉",area:"東京都中心部・港区台場",lat:35.629,lng:139.775,px:70,py:44,tag:"Odaiba night view Tokyo"},
    {id:"t3",name:"奥多摩湖",desc:"青々とした山々に囲まれた人造湖。紅葉シーズンは格別。",detail:{reason:"東京の水源として作られた人造湖ですが、山々が鏡のように映り込む絶景が広がります。",tips:["🚗 奥多摩湖ドライブは紅葉シーズンが特におすすめ","🛶 カヌー体験やキャンプも楽しめる","☕ 湖畔のカフェでのんびりするのが定番"],keywords:["湖","ドライブ","紅葉","奥多摩","自然"]},season:"秋",sc:"#fff3e0",st:"#e65100",e:"🍁",area:"東京都西部・奥多摩町",lat:35.809,lng:139.014,px:22,py:34,tag:"Okutama Japan"},

  神奈川:[
    {id:"kn1",name:"箱根",desc:"富士山を望む温泉リゾートの定番。",detail:{reason:"富士山の眺望と豊かな温泉が楽しめる関東随一のリゾートエリア。芦ノ湖畔の散策や大涌谷の迫力ある景観、美術館めぐりなど2人で楽しみ方は無限大。",tips:["🚡 箱根ロープウェイからの富士山が絶景","🥚 大涌谷の黒たまごを食べると7年長生きとか","♨️ 温泉の日帰り入浴施設が充実"],keywords:["富士山","温泉","芦ノ湖","リゾート","カップル"]},season:"通年",sc:"#fce4ec",st:"#880e4f",e:"🏔️",area:"神奈川県西部・箱根町",lat:35.233,lng:139.1,px:42,py:68,tag:"Hakone Japan"},
    {id:"kn2",name:"鎌倉",desc:"古都の寺社仏閣と海岸線が融合する人気観光地。",detail:{reason:"鶴岡八幡宮や高徳院（鎌倉大仏）など歴史ある寺社仏閣と、由比ヶ浜・材木座海岸などの海岸線が楽しめる。江ノ電に乗って2人でのんびり巡るのが定番。",tips:["🚃 江ノ電の鎌倉高校前駅は海と電車のインスタ映えスポット","🍴 小町通りで食べ歩きが楽しい","🌸 4月の桜と寺社のコントラストが美しい"],keywords:["江ノ電","大仏","寺社","海岸","食べ歩き"]},season:"通年",sc:"#e0f7fa",st:"#006064",e:"🌊",area:"神奈川県南部・鎌倉市",lat:35.319,lng:139.55,px:48,py:70,tag:"Kamakura Japan"},
    {id:"kn3",name:"横浜・みなとみらい",desc:"港と夜景が美しい都市型デートの定番。",detail:{reason:"横浜港を中心に、観覧車・赤レンガ倉庫・コスモクロック21などが集まる都市型デートの聖地。夜のイルミネーションは特にロマンチック。",tips:["🎡 観覧車からの夜景がロマンチック","🍺 横浜中華街でディナーもおすすめ","🚢 横浜港クルーズが人気"],keywords:["夜景","港","デート","イルミネーション","中華街"]},season:"通年",sc:"#e8eaf6",st:"#283593",e:"🌉",area:"神奈川県北部・横浜市",lat:35.458,lng:139.638,px:50,py:68,tag:"Yokohama Minato Mirai"},

  新潟:[
    {id:"ng1",name:"清津峡渓谷トンネル",desc:"日本三大峡谷のひとつ。鏡のような水盤が幻想的。",detail:{reason:"岩盤をくり抜いたトンネルを歩くと、最奥部に薄く水が張られた「パノラマステーション」が現れます。谷と空が映り込む幻想的な景色がSNSで大人気。",tips:["📸 水盤に映り込む谷の写真が定番","🎫 入場料が必要（1人600円）","🚗 越後湯沢から車で約20分"],keywords:["渓谷","水盤","インスタ映え","幻想的","トンネル"]},season:"春〜秋",sc:"#e3f2fd",st:"#1565c0",e:"💧",area:"新潟県南部・十日町市",lat:36.983,lng:138.65,px:38,py:52,tag:"Kiyotsu gorge Japan"},
    {id:"ng2",name:"越後湯沢温泉",desc:"スキーと温泉が楽しめる雪国リゾート。",detail:{reason:"川端康成の「雪国」の舞台として有名な温泉地。冬は世界有数の豪雪地帯でスキーが楽しめ、温泉でのんびりするのがカップルに人気。",tips:["⛷️ 苗場・かぐらなど有名スキー場が近い","♨️ 駅直結のCoCoLo湯沢で日帰り入浴可","🍶 新潟の地酒「越乃寒梅」などが有名"],keywords:["雪国","温泉","スキー","川端康成","日本酒"]},season:"通年",sc:"#e8eaf6",st:"#283593",e:"❄️",area:"新潟県南部・湯沢町",lat:36.933,lng:138.817,px:40,py:54,tag:"Echigo Yuzawa snow Japan"},
    {id:"ng3",name:"弥彦神社",desc:"越後の一宮として1,000年以上の歴史を持つ名社。",detail:{reason:"弥彦山を御神体とする越後の一宮。境内の美しさとパワースポットとしての雰囲気が人気で、弥彦山ロープウェイからの日本海の眺めも絶景。",tips:["🚡 弥彦山ロープウェイで山頂へ","🌸 4月の弥彦公園の桜が美しい","🎆 秋の菊まつりも有名"],keywords:["神社","パワースポット","ロープウェイ","日本海","桜"]},season:"通年",sc:"#fff3e0",st:"#e65100",e:"⛩️",area:"新潟県西部・弥彦村",lat:37.7,lng:138.817,px:32,py:50,tag:"Yahiko shrine Japan"},

  富山:[
    {id:"ty1",name:"立山黒部アルペンルート",desc:"雪の大谷など圧倒的なスケールの山岳観光ルート。",detail:{reason:"標高3,000m級の北アルプスを貫く山岳観光ルート。春は高さ20mにもなる「雪の大谷」が圧巻で、ロープウェイや高原バスで絶景を楽しめます。",tips:["❄️ 雪の大谷は4月中旬〜6月が見頃","🎒 服装は夏でも防寒具が必要","🚌 富山・長野どちらからでもアクセス可"],keywords:["雪の大谷","アルペンルート","北アルプス","絶景","山岳"]},season:"春〜秋",sc:"#e8eaf6",st:"#283593",e:"⛰️",area:"富山県東部・立山町",lat:36.567,lng:137.617,px:36,py:52,tag:"Tateyama Kurobe alpine route"},
    {id:"ty2",name:"富山湾の夜景",desc:"「世界で最も美しい湾クラブ」加盟の富山湾。",detail:{reason:"富山湾は「世界で最も美しい湾クラブ」に加盟。立山連峰を背景に広がる湾の夜景は「日本の三大夜景」にも数えられる美しさです。",tips:["🌟 展望台（呉羽山）からの夜景が定番","🦐 富山湾の白えびは「富山湾の宝石」","🐟 ホタルイカも富山の名物"],keywords:["夜景","富山湾","立山連峰","白えび","ホタルイカ"]},season:"通年",sc:"#e8eaf6",st:"#283593",e:"🌉",area:"富山県中部・富山市",lat:36.683,lng:137.217,px:34,py:54,tag:"Toyama bay night Japan"},

  石川:[
    {id:"is1",name:"金沢・兼六園",desc:"日本三名園のひとつ。雪吊りが有名な名勝庭園。",detail:{reason:"水戸の偕楽園、岡山の後楽園と並ぶ日本三名園。四季折々の景色が美しく、冬の雪吊りは金沢の冬の風物詩として有名です。",tips:["❄️ 冬の雪吊りは11月初旬から設置","🌸 春の桜と日本庭園のコントラストが絶景","☕ 金沢はカフェやスイーツも充実"],keywords:["日本三名園","雪吊り","金沢","庭園","四季"]},season:"通年",sc:"#e8f5e9",st:"#2e7d32",e:"🌿",area:"石川県中部・金沢市",lat:36.561,lng:136.662,px:32,py:52,tag:"Kenrokuen garden Kanazawa"},
    {id:"is2",name:"輪島の朝市",desc:"日本三大朝市のひとつ。1,000年の歴史を持つ市。",detail:{reason:"毎朝開かれる朝市で新鮮な海の幸や工芸品が並びます。輪島塗や能登の食文化に触れながら、早起きして2人で市場を歩くのが楽しい体験。",tips:["🌅 朝8時頃から始まるので早起きを","🦞 新鮮な海産物の試食・購入ができる","🏺 輪島塗の工房見学もおすすめ"],keywords:["朝市","輪島","海産物","輪島塗","能登"]},season:"通年",sc:"#fff3e0",st:"#e65100",e:"🐟",area:"石川県北部・輪島市",lat:37.4,lng:136.9,px:28,py:44,tag:"Wajima morning market Japan"},

  福井:[
    {id:"fi1",name:"東尋坊",desc:"日本海の荒波が削った柱状節理の断崖絶壁。",detail:{reason:"高さ25mの断崖絶壁が約1kmにわたって続く東尋坊は、国の天然記念物。荒々しい日本海と奇岩群の景色は迫力満点で、遊覧船からも楽しめます。",tips:["🚢 遊覧船から海から見上げる断崖が迫力満点","🦀 近くで越前ガニも食べられる","🌅 夕暮れ時の景色が特にロマンチック"],keywords:["断崖","柱状節理","日本海","遊覧船","夕日"]},season:"通年",sc:"#e0f7fa",st:"#006064",e:"🌊",area:"福井県西部・坂井市",lat:36.233,lng:136.133,px:28,py:54,tag:"Tojinbo cliff Japan"},
    {id:"fi2",name:"恐竜博物館",desc:"世界三大恐竜博物館のひとつ。迫力の展示が圧巻。",detail:{reason:"国内最大級の恐竜博物館で、世界三大恐竜博物館のひとつ。1,000点以上の標本を展示し、実物大の恐竜骨格が迫力満点。大人でも夢中になれる施設です。",tips:["🦕 実物大の恐竜骨格が40体以上展示","🎫 事前予約がおすすめ（特に休日）","🚗 勝山市内から無料シャトルバスあり"],keywords:["恐竜","博物館","勝山","世界三大","化石"]},season:"通年",sc:"#e8f5e9",st:"#2e7d32",e:"🦕",area:"福井県東部・勝山市",lat:36.067,lng:136.717,px:32,py:58,tag:"Fukui dinosaur museum"},

const photoCache = {};

async function getPhoto(spot) {
  if (photoCache[spot.id]) return photoCache[spot.id];
  try {
    const res = await fetch(
      `https://api.unsplash.com/search/photos?query=${encodeURIComponent(spot.tag)}&per_page=1&orientation=landscape&client_id=${UNSPLASH_KEY}`
    );
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const url = data.results[0].urls.regular;
      photoCache[spot.id] = url;
      return url;
    }
  } catch(e) {}
  return null;
}

function renderAnimeHome(){

function renderPrefConquest(){
  const done=Object.keys(prefVisited).length;
  const pct=Math.round(done/47*100);
  let html=`
    <div class="conquest-stats">
      <div class="conquest-stat"><div class="conquest-stat-num">${done}</div><div class="conquest-stat-label">制覇済み</div></div>
      <div class="conquest-stat"><div class="conquest-stat-num">${pct}%</div><div class="conquest-stat-label">達成率</div></div>
      <div class="conquest-stat"><div class="conquest-stat-num">${47-done}</div><div class="conquest-stat-label">残り</div></div>
    </div>
    <p class="hint">訪れた都道府県をタップして記録しよう</p>
    <div class="pref-conquest-grid">`;
  ALL_PREFS.forEach(pref=>{
    const isDone=!!prefVisited[pref];
    const date=isDone&&prefVisited[pref].date?prefVisited[pref].date:"";
    html+=`<button class="pref-conquest-btn${isDone?" done":""}" onclick="togglePrefVisited('${pref}')">
      <span class="pref-conquest-name">${isDone?"✓ ":""}${pref}</span>
      <span class="pref-conquest-date">${date}</span>
    </button>`;
  });
  html+="</div>";
  document.getElementById("main").innerHTML=html;
}

function togglePrefVisited(pref){
  if(prefVisited[pref])delete prefVisited[pref];
  else prefVisited[pref]={date:new Date().toLocaleDateString("ja-JP")};
  saveData();
  renderPrefConquest();
  // ヘッダーの進捗も更新
  const done=Object.keys(prefVisited).length;
  const pct=Math.round(done/47*100);
  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-label").textContent=done+"/47 ("+pct+"%)";
}

function updateProgress(){
  const done=Object.keys(visited).length,total=ALL_SPOTS.length,pct=Math.round(done/total*100);
  document.getElementById("progress-fill").style.width=pct+"%";
  document.getElementById("progress-label").textContent=done+"/"+total+" ("+pct+"%)";
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach((t,i)=>{t.classList.toggle("active",["spots","wishlist","mapview"][i]===tab)});
  view="map";currentPref=null;currentSpot=null;
  document.getElementById("back-btn").style.display="none";
  document.getElementById("app-title").textContent="全国絶景スポット";

function makeSVG(pref,rW,rH,spots,activeId){
  const sv=PREF_SVG[pref];
  if(!sv)return`<span style="font-size:32px">${SPOTS[pref][0].e}</span>`;
  const [,,vW,vH]=sv.vb.split(" ").map(Number);
  const sc=Math.min(rW/vW,rH/vH)*0.88;
  const dots=spots.map(s=>{
    const isA=s.id===activeId,isV=!!visited[s.id],isW=!!wishlist[s.id];
    const cx=s.px*sc,cy=s.py*sc,r=isA?6:3.5;
    const fill=isA?"#E24B4A":isV?"#7F77DD":isW?"#F59E0B":"rgba(128,128,128,0.3)";
    return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="white" stroke-width="${isA?2:1.2}"/>${isA?`<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="#E24B4A" stroke-width="1.2" opacity="0.4"/>`:""}`;
  }).join("");
  return`<svg viewBox="${sv.vb}" width="${vW*sc}" height="${vH*sc}" style="display:block"><path d="${sv.path}" fill="${sv.color}" stroke="#bbb" stroke-width="0.8" stroke-linejoin="round"/>${dots}</svg>`;
}

function instaUrl(tag){return"https://www.instagram.com/explore/tags/"+encodeURIComponent(tag)+"/";}

function toggleMore(){
  const btn=document.getElementById("more-toggle"),c=document.getElementById("more-content");
  const open=c.classList.contains("open");
  c.classList.toggle("open");btn.classList.toggle("open");
  btn.querySelector("span").textContent=open?"もっと見る":"閉じる";
}

function renderSpotMap(){
  view="map";
  let html='<p class="hint">行きたい都道府県を選ぼう</p><div class="pref-grid">';
  PREFS.forEach(pref=>{
    const total=SPOTS[pref].length,done=SPOTS[pref].filter(s=>visited[s.id]).length,allDone=done===total,pct=Math.round(done/total*100);
    html+=`<button class="pref-btn${allDone?" done":""}" onclick="renderDetail('${pref}')">
      <div class="pref-thumb">${makeSVG(pref,120,80,SPOTS[pref],null)}</div>
      <div class="pref-body">
        <div class="pref-name">${allDone?"✨ ":""}${pref}</div>
        <div class="pref-count">${done}/${total} 制覇</div>
        <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
      </div>
    </button>`;
  });
  html+="</div>";
  document.getElementById("main").innerHTML=html;
}

function renderWishlist(){
  const wishSpots=ALL_SPOTS.filter(s=>wishlist[s.id]&&!visited[s.id]);
  let html="";
  if(wishSpots.length===0){
    html=`<div class="empty-state"><div class="empty-icon">🌟</div><div class="empty-text">行きたいスポットがまだありません</div><div class="empty-sub">スポット詳細の「行きたい」ボタンで追加できます</div></div>`;
  }else{
    html=`<p class="section-label">行きたいスポット（${wishSpots.length}件）</p><div class="spot-list">`;
    wishSpots.forEach(spot=>{
      const pref=PREFS.find(p=>SPOTS[p].some(s=>s.id===spot.id));
      html+=`<div class="spot-card wishlist" onclick="goToSpot('${spot.id}','${pref}')">
        <div class="spot-header">
          <div class="spot-map-area">${makeSVG(pref,110,90,[spot],spot.id)}</div>
          <div class="spot-body">
            <div class="spot-name-row"><span class="spot-name">${spot.name}</span><span class="badge badge-wish">🌟 行きたい</span></div>
            <div class="spot-desc">${spot.desc}</div>
            <span class="season-tag" style="background:${spot.sc};color:${spot.st}">🗓 ${spot.season}</span>
          </div>
        </div>
      </div>`;
    });
    html+="</div>";
  }
  document.getElementById("main").innerHTML=html;
}

function goToSpot(spotId,pref){
  currentTab="spots";
  document.querySelectorAll(".tab").forEach((t,i)=>{t.classList.toggle("active",i===0)});
  renderDetail(pref);
  setTimeout(()=>renderSpot(spotId),10);
}

function renderMapView(){
  const total=ALL_SPOTS.length,done=Object.keys(visited).length,pct=Math.round(done/total*100);
  const prefsDone=PREFS.filter(p=>SPOTS[p].every(s=>visited[s.id])).length;
  const wishCount=Object.keys(wishlist).filter(id=>!visited[id]).length;
  const bubbles=PREFS.map(pref=>{
    const pos=JAPAN_POS[pref],spots=SPOTS[pref];
    const donePref=spots.filter(s=>visited[s.id]).length;
    const allDone=donePref===spots.length,anyDone=donePref>0;
    const fill=allDone?"#7F77DD":anyDone?"#B8B4EE":"#e5e5ea";
    const textFill=allDone||anyDone?"#fff":"#999";
    const stroke=allDone?"#5a54b5":anyDone?"#9994d4":"#ccc";
    return`<g onclick="switchTab('spots');setTimeout(()=>renderDetail('${pref}'),50)" style="cursor:pointer">
      <circle cx="${pos.x}" cy="${pos.y}" r="${pos.r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" opacity="0.95"/>
      <text x="${pos.x}" y="${pos.y+(donePref>0?-pos.r*0.2:1)}" text-anchor="middle" dominant-baseline="middle" font-size="${pos.r*0.62}" fill="${textFill}" font-family="sans-serif" font-weight="600">${pref.slice(0,2)}</text>
      ${donePref>0?`<text x="${pos.x}" y="${pos.y+pos.r*0.52}" text-anchor="middle" dominant-baseline="middle" font-size="${pos.r*0.52}" fill="${textFill}" font-family="sans-serif">${donePref}/${spots.length}</text>`:""}
    </g>`;
  }).join("");
  const visitedPrefs=PREFS.filter(p=>SPOTS[p].some(s=>visited[s.id]));
  const listHtml=visitedPrefs.length===0
    ?`<div style="text-align:center;color:var(--color-text3);font-size:13px;padding:24px 0">スポットを制覇するとここに表示されます</div>`
    :`<div class="visited-pref-list">${visitedPrefs.map(pref=>{
      const spots=SPOTS[pref],donePref=spots.filter(s=>visited[s.id]).length,allDone=donePref===spots.length,pct=Math.round(donePref/spots.length*100);
      return`<div class="visited-pref-item${allDone?" complete":""}" onclick="switchTab('spots');setTimeout(()=>renderDetail('${pref}'),50)">
        <span style="font-size:18px">${allDone?"✨":"📍"}</span>
        <span class="vpref-name">${pref}</span>
        <div class="vpref-bar-wrap"><div class="vpref-bar"><div class="vpref-bar-fill" style="width:${pct}%"></div></div></div>
        <span class="vpref-count">${donePref}/${spots.length}</span>
      </div>`;
    }).join("")}</div>`;
  document.getElementById("main").innerHTML=`
    <div class="map-stats">
      <div class="stat-card"><div class="stat-num">${done}</div><div class="stat-label">制覇済み</div></div>
      <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">達成率</div></div>
      <div class="stat-card"><div class="stat-num">${wishCount}</div><div class="stat-label">🌟行きたい</div></div>
    </div>
    <div class="japan-map-wrap">
      <svg viewBox="80 30 380 540" width="100%" style="max-height:280px">
        <ellipse cx="370" cy="100" rx="55" ry="45" fill="#dde8f5" opacity="0.5"/>
        <ellipse cx="340" cy="200" rx="28" ry="35" fill="#dde8f5" opacity="0.5"/>
        <ellipse cx="290" cy="270" rx="35" ry="30" fill="#dde8f5" opacity="0.5"/>
        <ellipse cx="255" cy="310" rx="55" ry="28" fill="#dde8f5" opacity="0.5"/>
        <ellipse cx="220" cy="340" rx="45" ry="25" fill="#dde8f5" opacity="0.5"/>
        <ellipse cx="195" cy="370" rx="35" ry="22" fill="#dde8f5" opacity="0.5"/>
        <ellipse cx="185" cy="410" rx="38" ry="38" fill="#dde8f5" opacity="0.4"/>
        <line x1="140" y1="530" x2="240" y2="500" stroke="#dde8f5" stroke-width="3" opacity="0.6"/>
        ${bubbles}
      </svg>
      <div class="map-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#7F77DD"></div>完全制覇</div>
        <div class="legend-item"><div class="legend-dot" style="background:#B8B4EE"></div>訪問中</div>
        <div class="legend-item"><div class="legend-dot" style="background:#e5e5ea;border:1px solid #ccc"></div>未訪問</div>
      </div>
    </div>
    <div class="section-label" style="margin-bottom:8px">訪問した都道府県（${visitedPrefs.length}件）</div>
    ${listHtml}
  `;
}

function renderDetail(pref){
  view="detail";currentPref=pref;
  document.getElementById("app-title").textContent="📍 "+pref;
  document.getElementById("back-btn").style.display="block";
  let html='<p class="hint">スポットをタップして詳細を確認しよう</p><div class="spot-list">';
  SPOTS[pref].forEach(spot=>{
    const isV=!!visited[spot.id],isW=!!wishlist[spot.id]&&!isV;
    html+=`<div class="spot-card${isV?" visited":isW?" wishlist":""}" onclick="renderSpot('${spot.id}')">
      <div id="card-img-${spot.id}" style="width:100%;height:160px;overflow:hidden;position:relative">
        ${imgPlaceholder(spot.e,spot.sc)}
        ${isV?'<div style="position:absolute;top:10px;right:10px;background:#7F77DD;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px">✓ 制覇済み</div>':""}
        ${isW?'<div style="position:absolute;top:10px;right:10px;background:#F59E0B;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px">🌟 行きたい</div>':""}
      </div>
      <div class="spot-body">
        <div class="spot-name-row"><span class="spot-name">${spot.name}</span></div>
        <div class="spot-desc">${spot.desc}</div>
        <span class="season-tag" style="background:${spot.sc};color:${spot.st}">🗓 ${spot.season}</span>
      </div>
    </div>`;
  });
  html+="</div>";
  document.getElementById("main").innerHTML=html;
  SPOTS[pref].forEach(async spot=>{
    const url=await getPhoto(spot);
    const el=document.getElementById("card-img-"+spot.id);
    if(el&&url){
      const isV=!!visited[spot.id],isW=!!wishlist[spot.id]&&!isV;
      el.innerHTML=`<img src="${url}" style="width:100%;height:160px;object-fit:cover;display:block">
        ${isV?'<div style="position:absolute;top:10px;right:10px;background:#7F77DD;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px">✓ 制覇済み</div>':""}
        ${isW?'<div style="position:absolute;top:10px;right:10px;background:#F59E0B;color:#fff;font-size:11px;padding:3px 10px;border-radius:10px">🌟 行きたい</div>':""}`;
    }
  });
}

function renderSpot(spotId){
  view="spot";
  currentSpot=ALL_SPOTS.find(s=>s.id===spotId);
  document.getElementById("app-title").textContent=currentSpot.name;
  document.getElementById("back-btn").style.display="block";
  const isV=!!visited[spotId],isW=!!wishlist[spotId],memo=memos[spotId]||"",d=currentSpot.detail;
  const mapsUrl=`https://www.google.com/maps?q=${currentSpot.lat},${currentSpot.lng}`;
  const igUrl=instaUrl(currentSpot.tag);
  const svgHtml=makeSVG(currentPref,130,120,SPOTS[currentPref],spotId);
  const tipsHtml=d.tips.map(t=>`<div class="tip-item">${t}</div>`).join("");
  const tagsHtml=d.keywords.map(k=>`<span class="keyword-tag">${k}</span>`).join("");
  document.getElementById("main").innerHTML=`
    <div id="hero-photo" style="width:100%;height:220px;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;position:relative">
      ${imgPlaceholder(currentSpot.e, currentSpot.sc)}
      <div style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.5);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px;backdrop-filter:blur(4px)">📍 ${currentSpot.area}</div>
    </div>
    <div style="margin-bottom:14px;background:var(--color-bg2);border-radius:var(--radius);padding:12px;border:0.5px solid var(--color-border);text-align:center">
      ${svgHtml}
      <div style="font-size:11px;color:var(--color-text3);margin-top:6px">県内でのおおよその位置</div>
    </div>
    <div class="action-links">
      <a href="${mapsUrl}" target="_blank" class="action-link">🗺 <span>Googleマップ</span></a>
      <a href="${igUrl}" target="_blank" class="action-link insta-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E1306C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#E1306C" stroke="none"/></svg>
        <span>インスタで見る</span>
      </a>
    </div>
    <div class="detail-card">
      <div class="detail-name">${currentSpot.name}</div>
      <div class="detail-desc">${currentSpot.desc}</div>
      <span class="season-tag" style="background:${currentSpot.sc};color:${currentSpot.st};font-size:13px;padding:5px 16px">🗓 ${currentSpot.season}がおすすめ</span>
      <div class="more-section">
        <button class="more-toggle" id="more-toggle" onclick="toggleMore()"><span>もっと見る</span> <span class="more-arrow">▼</span></button>
        <div class="more-content" id="more-content"><div class="more-inner">
          <div class="more-block"><div class="more-block-label">❤️ おすすめの理由</div><div class="more-block-text">${d.reason}</div></div>
          <div class="more-block"><div class="more-block-label">💡 行く前に知っておきたいこと</div><div class="tips-list">${tipsHtml}</div></div>
          <div class="more-block"><div class="more-block-label">🏷 キーワード</div><div class="tags-row">${tagsHtml}</div></div>
        </div></div>
      </div>
    </div>
    <div class="action-btns">
      <button class="wish-btn${isW&&!isV?" active":""}" onclick="toggleWish('${spotId}')" ${isV?"disabled":""}>
        ${isW&&!isV?"🌟 行きたい！":"🌟 行きたい"}
      </button>
      <button class="seika-btn${isV?" done":""}" onclick="toggleVisited('${spotId}')">
        ${isV?"✓ 制覇済み":"🏆 制覇した！"}
      </button>
    </div>
    ${isV&&visited[spotId]&&visited[spotId].date?`<div class="visit-date">${visited[spotId].date} に制覇しました 🎉</div>`:""}
    <div class="memo-card"><div class="memo-label">📝 メモ・感想</div><textarea id="memo-input" placeholder="行った感想や次回へのメモを残そう...">${memo}</textarea></div>
  `;
  document.getElementById("memo-input").addEventListener("input",e=>{memos[spotId]=e.target.value;saveData();});

  // ヒーロー写真を非同期で読み込み
  getPhoto(currentSpot).then(url=>{
    const el=document.getElementById("hero-photo");
    if(el&&url){
      el.innerHTML=`<img src="${url}" style="width:100%;height:220px;object-fit:cover;display:block">
        <div style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.5);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px;backdrop-filter:blur(4px)">📍 ${currentSpot.area}</div>`;
    }
  });
}

function toggleWish(spotId){
  if(wishlist[spotId])delete wishlist[spotId];
  else wishlist[spotId]=true;
  saveData();renderSpot(spotId);
}

function toggleVisited(spotId){
  if(visited[spotId]){delete visited[spotId];}
  else{visited[spotId]={date:new Date().toLocaleDateString("ja-JP")};delete wishlist[spotId];}
  saveData();updateProgress();renderSpot(spotId);
}

document.getElementById("back-btn").addEventListener("click",()=>{
  if(currentCategory==="pref"){
    renderHome();
    updateProgress();
  } else if(view==="spot"){
    renderDetail(currentPref);
    } else if(currentCategory==="anime"&&currentAnimeWork){
    currentAnimeWork=null;
    renderAnimeHome();
    return;
  } else if(currentCategory==="anime"){
    renderHome();
    return;
  } else if(view==="detail"){
    view="map";currentPref=null;
    document.getElementById("back-btn").style.display="none";
    document.getElementById("app-title").textContent="全国絶景スポット";
    renderSpotMap();
  } else {
    renderHome();
  }
});

// Service Worker登録
if("serviceWorker"in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

loadData();
document.getElementById("tabs").style.display="none";
renderHome();
updateProgress();
</script>
</body>
</html>
